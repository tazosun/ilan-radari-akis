name: Facebook paylaşımı

# Alım Var Facebook sayfası: günde bir ilan, 06:00 (Türkiye saati).
# Her gün yeni ilanları Facebook'un zamanlayıcısıyla ileriki günlerin 06:00'sına planlar;
# GitHub geç kalsa ya da bir gün atlasa da planlı gönderiler saatinde çıkar.
on:
  schedule:
    - cron: "45 2 * * *"   # 02:45 UTC = 05:45 TR
  workflow_dispatch:
    inputs:
      deneme:
        description: "Paylaşmadan sadece planı yazdır"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: facebook-paylasim
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paylaş
        env:
          ALIMVAR_FB_SAYFA: "1419226681279133"   # Alım Var sayfası (gizli değil)
          ALIMVAR_FB_ANAHTAR: ${{ secrets.ALIMVAR_FB_ANAHTAR }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deneme }}" = "true" ]; then
            python3 -I sunucu/facebook_paylas.py --deneme
          else
            python3 -I sunucu/facebook_paylas.py
          fi
      - name: Paylaşılanları kaydet
        if: always()
        run: |
          git config user.name "alimvar-bot"
          git config user.email "alimvar-bot@users.noreply.github.com"
          git add akis/facebook-paylasilanlar.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Facebook paylaşım kaydı"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
